services:
  api:
    build:
      context: .
      target: api
    env_file: .env.production
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      DATABASE_URL: file:/data/grain.db
    volumes:
      - grain-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      target: web
      args:
        VITE_DRIVER_URL: ${VITE_DRIVER_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  grain-data:
