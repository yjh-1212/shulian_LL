server {
  listen 8080;
  root /usr/share/nginx/html/pc;
  index index.html;
  client_max_body_size 9m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/ { proxy_pass http://api:3001; proxy_set_header Host $host; proxy_read_timeout 180s; }
  location /_AMapService/ { proxy_pass http://api:3001; proxy_read_timeout 30s; }
  location / { try_files $uri $uri/ /index.html; }
}
server {
  listen 8081;
  root /usr/share/nginx/html/driver;
  index driver.html;
  client_max_body_size 9m;
  add_header X-Content-Type-Options nosniff always;
  location /api/ { proxy_pass http://api:3001; proxy_set_header Host $host; proxy_read_timeout 180s; }
  location / { try_files $uri $uri/ /driver.html; }
}
